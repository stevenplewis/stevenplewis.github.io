<?xml version="1.0" encoding="UTF-8"?>
<svg id="Drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <style>
      .cls-1 {
        fill: none;
        stroke: #19111e;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5px;
      }

      /* Animation for the horizontal movement */

      @keyframes moveHorizontal {
        0% { transform: translateX(0); }
        5%, 40% { transform: translateX(-1.6px); }
        50%, 95% { transform: translateX(1.6px); 
        100% { transform: translateX(0); }
        }
      }
      
      /* Apply animations to elements */
      #movingElement {
        animation: moveHorizontal 2.5s linear infinite;
      }
    </style>
  </defs>
  <line id="movingElement" class="cls-1" x1="8" y1="8.06" x2="8" y2="8.56"/>
  <path class="cls-1" d="M8,6.13c1.8,0,3.31,1.53,3.74,3.59-1.36.58-2.64.77-3.74.78-1.1,0-2.38-.2-3.74-.78.43-2.07,1.94-3.59,3.74-3.59Z"/>
  <path class="cls-1" d="M8,3c-1.75,2-4.75,6.25-5.75,9.5,3.77.67,7.77.67,11.5,0-1-3.25-4-7.5-5.75-9.5Z"/>
</svg>