<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Obscura Photobooth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .camera-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #canvas {
            display: none;
        }

        .controls {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .slider-group {
            margin: 15px 0;
            text-align: left;
        }

        .slider-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.3);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .photo-grid {
            display: none;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            width: 300px;
            height: 400px;
            margin: 20px auto;
            background: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .photo-slot {
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
            display: none;
        }

        .progress {
            margin: 20px 0;
            text-align: center;
            font-size: 18px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
            width: 0%;
            transition: width 0.3s ease;
        }

        .reset-btn {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
        }

        .download-btn {
            background: linear-gradient(135deg, #00b894, #00a085);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Camera Obscura Photobooth</h1>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div id="countdown" class="countdown"></div>
        </div>

        <div class="controls">
            <div class="slider-group">
                <label for="perspective">Perspective Correction (Keystone)</label>
                <input type="range" id="perspective" class="slider" min="-30" max="30" value="0">
            </div>
        </div>

        <div class="progress" id="progress" style="display: none;">
            <div>Photo <span id="current-photo">0</span> of 4</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <button id="start-btn" class="btn">📸 TAKE PHOTOS</button>
        <button id="reset-btn" class="btn reset-btn" style="display: none;">🔄 TAKE NEW PHOTOS</button>
        <button id="download-btn" class="btn download-btn" style="display: none;">💾 DOWNLOAD STRIP</button>

        <div id="photo-grid" class="photo-grid">
            <div class="photo-slot" id="slot-1"></div>
            <div class="photo-slot" id="slot-2"></div>
            <div class="photo-slot" id="slot-3"></div>
            <div class="photo-slot" id="slot-4"></div>
        </div>
    </div>

    <script>
        let video, canvas, ctx;
        let photos = [];
        let currentPhotoIndex = 0;
        let isCapturing = false;
        let stream = null;

        // Image adjustment values
        let perspective = 0;

        // Apply live video filter preview
        function updateVideoFilter() {
            const videoEl = document.getElementById('video');
            const skewValue = perspective * 0.5; // Adjust sensitivity
            videoEl.style.transform = `perspective(1000px) rotateY(${skewValue}deg)`;
        }

        async function initCamera() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1920 }
                    }
                });
                video.srcObject = stream;
                
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                });
            } catch (err) {
                console.error('Error accessing camera:', err);
                alert('Unable to access camera. Please make sure you\'ve granted camera permissions.');
            }
        }

        function capturePhoto() {
            // Set canvas to square dimensions
            const size = Math.min(video.videoWidth, video.videoHeight);
            canvas.width = size;
            canvas.height = size;

            // Calculate crop position for center square
            const cropX = (video.videoWidth - size) / 2;
            const cropY = (video.videoHeight - size) / 2;

            // Clear canvas and apply perspective transformation
            ctx.clearRect(0, 0, size, size);
            
            if (perspective !== 0) {
                const skewX = perspective * 0.002; // Adjust sensitivity
                ctx.save();
                ctx.transform(1, 0, skewX, 1, 0, 0);
                ctx.drawImage(video, cropX, cropY, size, size, 0, 0, size, size);
                ctx.restore();
            } else {
                ctx.drawImage(video, cropX, cropY, size, size, 0, 0, size, size);
            }

            // Convert to data URL and store
            const photoData = canvas.toDataURL('image/jpeg', 0.8);
            photos[currentPhotoIndex] = photoData;

            // Display in grid
            const slot = document.getElementById(`slot-${currentPhotoIndex + 1}`);
            const img = document.createElement('img');
            img.src = photoData;
            slot.innerHTML = '';
            slot.appendChild(img);

            currentPhotoIndex++;
            updateProgress();

            if (currentPhotoIndex >= 4) {
                completeSession();
            }
        }

        function countdown(callback) {
            const countdownEl = document.getElementById('countdown');
            countdownEl.style.display = 'block';
            
            let count = 3;
            countdownEl.textContent = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else if (count === 0) {
                    countdownEl.textContent = '📸';
                    setTimeout(() => {
                        countdownEl.style.display = 'none';
                        callback();
                        
                        // Short delay between photos, then start next countdown
                        if (currentPhotoIndex < 4) {
                            setTimeout(() => {
                                if (currentPhotoIndex < 4) {
                                    countdown(capturePhoto);
                                }
                            }, 1500);
                        }
                        clearInterval(interval);
                    }, 500);
                } else {
                    clearInterval(interval);
                }
            }, 1000);
        }

        function updateProgress() {
            const progressEl = document.getElementById('progress');
            const currentPhotoEl = document.getElementById('current-photo');
            const progressFill = document.getElementById('progress-fill');

            progressEl.style.display = 'block';
            currentPhotoEl.textContent = currentPhotoIndex;
            progressFill.style.width = (currentPhotoIndex / 4) * 100 + '%';
        }

        function startPhotoSession() {
            if (isCapturing) return;

            isCapturing = true;
            photos = [];
            currentPhotoIndex = 0;

            // Show grid and hide start button
            document.getElementById('photo-grid').style.display = 'grid';
            document.getElementById('start-btn').style.display = 'none';

            // Clear previous photos
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`slot-${i}`).innerHTML = '';
            }

            updateProgress();
            countdown(capturePhoto);
        }

        function completeSession() {
            isCapturing = false;
            document.getElementById('progress').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'inline-block';
            document.getElementById('download-btn').style.display = 'inline-block';
        }

        function resetSession() {
            photos = [];
            currentPhotoIndex = 0;
            isCapturing = false;

            document.getElementById('photo-grid').style.display = 'none';
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('reset-btn').style.display = 'none';
            document.getElementById('download-btn').style.display = 'none';
            document.getElementById('progress').style.display = 'none';
        }

        function downloadPhotoStrip() {
            const stripCanvas = document.createElement('canvas');
            const stripCtx = stripCanvas.getContext('2d');
            
            // Higher resolution photo strip
            const stripWidth = 1200;
            const stripHeight = 1600;
            const border = 60;
            const photoSize = (stripWidth - border * 3) / 2; // Account for outer borders and center gap
            const gap = 20;
            
            stripCanvas.width = stripWidth;
            stripCanvas.height = stripHeight;

            // White background with border
            stripCtx.fillStyle = 'white';
            stripCtx.fillRect(0, 0, stripWidth, stripHeight);

            // Add title with better positioning
            stripCtx.fillStyle = '#333';
            stripCtx.font = 'bold 48px Arial';
            stripCtx.textAlign = 'center';
            stripCtx.fillText('Camera Obscura Photobooth', stripWidth / 2, border + 40);

            // Calculate photo grid starting position
            const gridStartY = border + 80;
            const gridHeight = stripHeight - gridStartY - border;
            const photoAreaHeight = (gridHeight - gap) / 2;

            // Draw photos in 2x2 grid with proper borders
            let photosLoaded = 0;
            photos.forEach((photoData, index) => {
                const img = new Image();
                img.onload = () => {
                    const row = Math.floor(index / 2);
                    const col = index % 2;
                    const x = border + col * (photoSize + gap);
                    const y = gridStartY + row * (photoAreaHeight + gap);

                    // Draw photo maintaining aspect ratio
                    stripCtx.drawImage(img, x, y, photoSize, photoAreaHeight);

                    photosLoaded++;
                    // If this is the last photo, trigger download
                    if (photosLoaded === photos.length) {
                        const link = document.createElement('a');
                        link.download = `photobooth-strip-${new Date().getTime()}.jpg`;
                        link.href = stripCanvas.toDataURL('image/jpeg', 0.95);
                        link.click();
                    }
                };
                img.src = photoData;
            });
        }

        // Event listeners
        document.getElementById('start-btn').addEventListener('click', startPhotoSession);
        document.getElementById('reset-btn').addEventListener('click', resetSession);
        document.getElementById('download-btn').addEventListener('click', downloadPhotoStrip);

        // Slider controls
        document.getElementById('perspective').addEventListener('input', (e) => {
            perspective = parseInt(e.target.value);
            updateVideoFilter(); // Apply live preview
        });

        // Initialize camera when page loads
        window.addEventListener('load', initCamera);

        // Prevent zoom on double-tap
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
